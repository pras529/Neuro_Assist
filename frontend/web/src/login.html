<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Neuro-Assist</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h2>Login to Neuro-Assist</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
            <p class="register-link">Don't have an account? <a href="register.html">Register here</a></p>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loginForm = document.getElementById("login-form");

            if (!loginForm) {
                console.error("Login form not found! Check your HTML.");
                return;
            }

            loginForm.addEventListener("submit", async function(event) {
                event.preventDefault();  // Prevent default form submission

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value.trim();

                if (!email || !password) {
                    alert("Please fill in all fields.");
                    return;
                }

                try {
                    const response = await fetch("http://localhost:5000/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {

                        //  Store login details (Example: JWT or User ID)
                        localStorage.setItem("userToken", data.token); // Store token
                        localStorage.setItem("userEmail", email); // Store email
                        window.location.href = "dashboard.html"; // Redirect to dashboard
                    } else {
                        alert(data.message || "Login failed!");
                    }
                } catch (error) {
                    console.error("Error during login:", error);
                    alert("Something went wrong. Try again later.");
                }
            });
        });
    </script>
</body>
</html>
